<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Vitaprash checkout information.">
  <link rel="stylesheet" href="css/vitaprash.css">
</head>
<body>
  <div id="cursor" aria-hidden="true"></div><div id="cursorRing" aria-hidden="true"></div>
  <main style="max-width:760px;margin:0 auto;padding:clamp(3rem,8vw,7rem) 1.5rem;min-height:65vh">
    <div class="section-kicker">Checkout</div>

    <p style="margin-top:2rem"><a class="btn-primary" href="cart.html">Return to your cart</a> <a class="btn-outline" href="shop.html" style="margin-left:.75rem">Continue browsing</a></p>
